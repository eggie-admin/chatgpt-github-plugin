name: Lum Pet Cathedral CI

on:
  push:
    branches: [feat/lum-scene-forge-plugin]
  pull_request:
    paths:
      - "lum-pet-cathedral/**"
      - ".github/workflows/lum-pet-cathedral-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lum-pet-cathedral
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run test
      - run: npm run build
